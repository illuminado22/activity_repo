---
- name: Install Kibana
  ansible.builtin.apt:
    name: kibana
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Allow external traffic on port 5601
  ansible.builtin.lineinfile:
    path: /etc/kibana/kibana.yml
    regexp: '^#?server.host:'
    line: 'server.host: "0.0.0.0"'
  notify: restart_kibana

- name: Point Kibana to Elasticsearch host
  ansible.builtin.lineinfile:
    path: /etc/kibana/kibana.yml
    regexp: '^#?elasticsearch.hosts:'
    line: 'elasticsearch.hosts: ["http://{{ hostvars[groups.elastic_servers[0]].ansible_host }}:9200"]' 
  notify: restart_kibana

- name: Ensure Kibana is started and enabled
  ansible.builtin.service:
    name: kibana
    state: started
    enabled: true